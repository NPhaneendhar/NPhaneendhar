<svg width="100%" height="220" viewBox="0 0 950 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="50%" stop-color="#111923"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.45"/>
    </pattern>

    <!-- CRT Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Green Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26a641"/>
      <stop offset="50%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#56ff78"/>
    </linearGradient>
  </defs>

  <!-- Terminal Chassis / Bezel -->
  <rect x="2" y="2" width="946" height="216" rx="10" fill="url(#termBg)" stroke="#30363d" stroke-width="2"/>
  <rect x="12" y="12" width="926" height="196" rx="6" fill="#070b0e" stroke="#238636" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- CRT Scanlines overlay -->
  <rect x="12" y="12" width="926" height="196" rx="6" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Window Header Bar -->
  <rect x="12" y="12" width="926" height="34" rx="6" fill="#161b22"/>
  <line x1="12" y1="46" x2="938" y2="46" stroke="#238636" stroke-width="1.2"/>

  <!-- Window Buttons / Terminal Status LEDs -->
  <circle cx="34" cy="29" r="6" fill="#da3633"/>
  <circle cx="52" cy="29" r="6" fill="#d29922"/>
  <circle cx="70" cy="29" r="6" fill="#39d353" filter="url(#neonGlow)"/>

  <!-- Window Title -->
  <text x="475" y="30" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#8b949e" text-anchor="middle" letter-spacing="3">
    ARCH-LINUX-x86_64 // PHANIX-STATION-HUD // ROOT-SESSION
  </text>

  <!-- Top Right Operational Badge -->
  <text x="915" y="30" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#39d353" text-anchor="end" filter="url(#neonGlow)">
    [ SYSTEM: ONLINE ]
  </text>

  <!-- Main Display Typography -->
  <g filter="url(#neonGlow)">
    <!-- Subtitle Prompt -->
    <text x="475" y="80" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="600" fill="#7ee787" text-anchor="middle" letter-spacing="4">
      [:: FORENSIC WORKSTATION // INVESTIGATION MAINFRAME ::]
    </text>

    <!-- Main Title -->
    <text x="475" y="128" font-family="'Courier New', Courier, monospace" font-size="38" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="6">
      PHANEENDHAR NITTALA
    </text>
  </g>

  <!-- Sub Text / Specialty -->
  <text x="475" y="162" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle" letter-spacing="3">
    DIGITAL FORENSICS <tspan fill="#39d353">•</tspan> CYBER INVESTIGATION <tspan fill="#39d353">•</tspan> PYTHON TOOLING <tspan fill="#39d353">•</tspan> ARCH LINUX
  </text>

  <!-- Prompt Command Line Footer inside Header -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600">
    <text x="35" y="194" fill="#8b949e">
      <tspan fill="#39d353">root@phanix-station</tspan>:<tspan fill="#58a6ff">~</tspan># pacman -Syu phanix-core evidence-hasher --integrity=SHA256
    </text>
    <rect x="745" y="182" width="9" height="14" fill="#39d353" filter="url(#neonGlow)"/>
  </g>

  <!-- Top Left / Right Corner Bracket Accents -->
  <path d="M 22 24 L 22 22 L 24 22" stroke="#39d353" stroke-width="2"/>
  <path d="M 926 24 L 926 22 L 924 22" stroke="#39d353" stroke-width="2"/>
  <path d="M 22 198 L 22 200 L 24 200" stroke="#39d353" stroke-width="2"/>
  <path d="M 926 198 L 926 200 L 924 200" stroke="#39d353" stroke-width="2"/>
</svg>
