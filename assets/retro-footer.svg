<svg width="100%" height="110" viewBox="0 0 950 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="50%" stop-color="#111923"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <pattern id="footScanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.4"/>
    </pattern>
    <filter id="neonGlowFoot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="946" height="106" rx="8" fill="url(#footBg)" stroke="#30363d" stroke-width="2"/>
  <rect x="10" y="10" width="930" height="90" rx="6" fill="#070b0e" stroke="#238636" stroke-width="1.2" stroke-dasharray="6 3"/>
  <rect x="10" y="10" width="930" height="90" rx="6" fill="url(#footScanlines)" pointer-events="none"/>

  <text x="475" y="44" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#39d353" text-anchor="middle" letter-spacing="4" filter="url(#neonGlowFoot)">
    [ MISSION_STATUS: ACTIVE // ALL INTEGRITY PROTOCOLS DEFENDED ]
  </text>
  <text x="475" y="74" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="3">
    "Every file tells a story. Every log leaves a trace. Every byte can matter."
  </text>
</svg>
